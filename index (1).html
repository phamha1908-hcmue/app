<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập truy xuất DOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nen: #eaf1f6;
    --the: #ffffff;
    --muc: #12263a;
    --muc-nhat: #5b6f82;
    --xanh: #0f8b8d;
    --xanh-dam: #0a6668;
    --vang: #f6b93b;
    --vien: #d3dfe8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 56px;
    background: var(--nen); color: var(--muc);
    font-family: "Be Vietnam Pro", system-ui, Arial, sans-serif; line-height: 1.55;
  }
  main { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  header p { margin: 4px 0 0; color: var(--muc-nhat); }

  section {
    background: var(--the); border: 1px solid var(--vien);
    border-radius: 14px; padding: 22px 24px; margin-bottom: 20px;
  }
  section h2 { margin: 0 0 14px; font-size: 1.15rem; font-weight: 700; }
  section h2 small { display: block; font-weight: 500; color: var(--muc-nhat); font-size: .85rem; }

  input[type=text] {
    font: inherit; padding: 10px 12px; min-width: 0; flex: 1;
    border: 1.5px solid var(--vien); border-radius: 8px; background: #f8fbfd; color: var(--muc);
  }
  input[type=text]:focus { outline: 3px solid rgba(15,139,141,.25); border-color: var(--xanh); }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--xanh); color: #fff;
  }
  button:hover { background: var(--xanh-dam); }
  button:focus-visible { outline: 3px solid var(--vang); outline-offset: 2px; }
  button.phu { background: #e3edf3; color: var(--muc); }
  button.phu:hover { background: #d3e2ec; }

  .hang { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* 3.2.1 */
  .luoi { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 560px) { .luoi { grid-template-columns: 1fr; } }
  #hover_div {
    height: 120px; display: grid; place-items: center;
    background: var(--muc); color: #fff; border-radius: 12px;
    font-size: 1.25rem; font-weight: 700; cursor: pointer; user-select: none;
    transition: background .15s, color .15s;
  }
  #hover_div.dang-hover { background: var(--vang); color: var(--muc); }
  .khung-anh { height: 120px; display: grid; place-items: center; background: #f1f6f9; border-radius: 12px; }
  #hinh { width: 80px; height: 80px; border-radius: 12px; transition: width .12s, height .12s; }
  .nhan { font-size: .8rem; color: var(--muc-nhat); margin: 6px 2px 0; }
  .cach-nhau { margin-top: 18px; display: grid; gap: 14px; }
  .kq { margin-top: 14px; font-size: 1.15rem; font-weight: 700; min-height: 1.7em; }

  /* 3.2.2 */
  .gia { display: inline-block; background: var(--vang); color: var(--muc); padding: 4px 14px; border-radius: 8px; }
  .khong { color: #b3392f; }
  .goi-y { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .goi-y button { padding: 5px 12px; font-size: .85rem; font-weight: 500; }

  /* 3.2.3 */
  .ngay { display: inline-flex; align-items: baseline; gap: 8px; }
  .ngay b { font-size: 2.2rem; color: var(--xanh); line-height: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bài tập truy xuất DOM</h1>
    <p>Bài tập Thiết kế Web, mục 3.2</p>
  </header>

  <!-- ========== 3.2.1 ========== -->
  <section>
    <h2>3.2.1. Hiệu chỉnh theo sự kiện chuột</h2>
    <div class="luoi">
      <div>
        <div id="hover_div">Hover Me</div>
        <p class="nhan">Rê chuột vào khung để đổi chữ</p>
      </div>
      <div>
        <div class="khung-anh">
          <img id="hinh" alt="Hình minh họa"
               src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230f8b8d'/><stop offset='1' stop-color='%23f6b93b'/></linearGradient></defs><rect width='80' height='80' fill='url(%23g)'/><circle cx='40' cy='40' r='20' fill='white' fill-opacity='.85'/></svg>">
        </div>
        <p class="nhan">Rê chuột vào ảnh để phóng to 10%</p>
      </div>
    </div>

    <div class="cach-nhau">
      <div>
        <button id="btn_time">Xem ngày giờ hiện tại</button>
        <div class="kq" id="kq_time"></div>
      </div>
      <div class="hang">
        <input type="text" id="txt_hoa" value="xin chào">
        <button id="btn_hoa">IN HOA</button>
      </div>
    </div>
  </section>

  <!-- ========== 3.2.2 ========== -->
  <section>
    <h2>3.2.2. Giá hoa quả</h2>
    <div class="hang">
      <input type="text" id="ten_hoa_qua" placeholder="Nhập tên hoa quả, ví dụ: Măng Cụt">
      <button onclick="xemGia()">Xem giá</button>
    </div>
    <div class="goi-y" id="goi_y"></div>
    <div class="kq" id="kq_gia"></div>
  </section>

  <!-- ========== 3.2.3 ========== -->
  <section>
    <h2>3.2.3. Tính số ngày trong tháng</h2>
    <div class="hang">
      <input type="text" id="thang" placeholder="Nhập tháng từ 1 đến 12">
      <button onclick="tinhSoNgay()">Tính số ngày</button>
    </div>
    <div class="kq" id="kq_ngay"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
